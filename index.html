<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>도트 낚시 게임</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a1c2c;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      image-rendering: pixelated;
    }

    .game-container {
      display: flex;
      gap: 20px;
      max-width: 1000px;
      width: 100%;
    }

    /* 왼쪽 도감 */
    .collection {
      width: 220px;
      background: #2a2c3c;
      border: 4px solid #4a4c6c;
      padding: 12px;
      font-size: 10px;
      max-height: 520px;
      overflow-y: auto;
    }
    .collection h2 {
      font-size: 12px;
      margin-bottom: 12px;
      color: #ffd700;
      text-align: center;
    }
    .fish-count {
      display: flex;
      justify-content: space-between;
      margin: 6px 0;
      padding: 4px 0;
      border-bottom: 1px solid #3a3c4c;
    }
    .fish-count span:first-child {
      color: #aaa;
      max-width: 140px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }



    /* 물고기 도감 이미지 */
    .fish-count {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      min-height: 38px;
    }
    .fish-entry {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }
    .fish-entry img {
      width: 34px;
      height: 34px;
      object-fit: contain;
      image-rendering: pixelated;
      flex: 0 0 34px;
    }
    .fish-entry span {
      color: #c8c8d4;
      font-size: 9px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .fish-count .fish-number {
      color: #fff;
      font-size: 11px;
      flex: 0 0 auto;
    }
    .result-fish-image {
      display: block;
      width: 124px;
      height: 124px;
      object-fit: contain;
      image-rendering: pixelated;
      margin: 8px auto;
      filter: drop-shadow(0 4px 0 rgba(0,0,0,.3));
    }
    @media (max-width: 700px) {
      body { align-items: flex-start; padding: 8px; }
      .game-container { flex-direction: column; }
      .collection { width: 100%; max-height: 190px; }
      .main { width: 100%; }
    }

    /* 메인 낚시 화면 */
    .main {
      flex: 1;
      background: #2a2c3c;
      border: 4px solid #4a4c6c;
      padding: 16px;
      text-align: center;
      position: relative;
    }

    .scene {
      height: 220px;
      background: linear-gradient(to bottom, #87ceeb 0%, #87ceeb 55%, #4a90d9 55%, #2a5a8a 100%);
      border: 3px solid #333;
      position: relative;
      margin-bottom: 16px;
      overflow: hidden;
    }

    /* 땅 */
    .ground {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 45%;
      height: 45%;
      background: #5a8f3c;
      border-right: 3px solid #3a6f2c;
    }

    /* 간단한 스틱맨 + 의자 */
    .stickman {
      position: absolute;
      bottom: 38%;
      left: 22%;
      width: 40px;
      height: 60px;
    }
    .head {
      width: 16px;
      height: 16px;
      background: #ffcc99;
      border: 2px solid #333;
      border-radius: 50%;
      margin: 0 auto;
    }
    .body {
      width: 4px;
      height: 22px;
      background: #333;
      margin: 0 auto;
    }
    .arm {
      position: absolute;
      top: 18px;
      left: 18px;
      width: 20px;
      height: 3px;
      background: #333;
      transform-origin: left center;
    }
    .leg {
      position: absolute;
      top: 38px;
      left: 14px;
      width: 3px;
      height: 16px;
      background: #333;
    }
    .leg2 {
      left: 22px;
    }
    .chair {
      position: absolute;
      bottom: 0;
      left: 8px;
      width: 28px;
      height: 20px;
      border: 3px solid #5c3317;
      border-bottom: none;
      background: transparent;
    }

    /* 낚싯대 */
    .rod {
      position: absolute;
      top: 22px;
      left: 36px;
      width: 80px;
      height: 3px;
      background: #8b4513;
      transform: rotate(-15deg);
      transform-origin: left center;
    }
    .line {
      position: absolute;
      top: 20px;
      left: 110px;
      width: 2px;
      height: 70px;
      background: #ccc;
      transform-origin: top center;
    }
    .bobber {
      position: absolute;
      bottom: -6px;
      left: -4px;
      width: 10px;
      height: 10px;
      background: #e74c3c;
      border: 2px solid #c0392b;
      border-radius: 50%;
    }

    /* 물결 */
    .wave {
      position: absolute;
      bottom: 30%;
      right: 10%;
      width: 60px;
      height: 4px;
      background: rgba(255,255,255,0.3);
      border-radius: 50%;
    }

    h1 {
      font-size: 16px;
      margin-bottom: 12px;
      color: #7fdbff;
    }

    button {
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      padding: 12px 24px;
      background: #3d5a80;
      color: white;
      border: 4px solid #1b3a4b;
      cursor: pointer;
      margin: 8px;
    }
    button:hover { background: #4a6fa5; }
    button:disabled {
      background: #555;
      cursor: not-allowed;
    }

    #status {
      font-size: 11px;
      min-height: 40px;
      margin: 12px 0;
      color: #ffd700;
    }

    /* 결과 배너 */
    .result-banner {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border: 4px solid;
      font-size: 11px;
      animation: pop 0.3s ease;
    }
    @keyframes pop {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .result-banner .grade {
      font-size: 14px;
      margin-bottom: 6px;
    }
    .result-banner .fish-name {
      font-size: 13px;
      margin: 8px 0;
    }

    /* 등급별 색깔 */
    .normal   { border-color: #aaaaaa; color: #ddd; background: #333; }
    .advanced { border-color: #4caf50; color: #81c784; background: #1b3a1b; }
    .rare     { border-color: #2196f3; color: #64b5f6; background: #0d2137; }
    .elite    { border-color: #9c27b0; color: #ce93d8; background: #2a1035; }
    .epic     { border-color: #e91e63; color: #f48fb1; background: #3a1020; }
    .unique   { border-color: #ff9800; color: #ffb74d; background: #3a2a10; }
    .legendary{ border-color: #f44336; color: #ef9a9a; background: #3a1010; box-shadow: 0 0 12px #f44336; }
    .mythical { border-color: #00bcd4; color: #80deea; background: #10303a; box-shadow: 0 0 16px #00bcd4; }
    .immortal { border-color: #ffd700; color: #fff59d; background: #3a3010; box-shadow: 0 0 20px #ffd700; }

    .click-alert {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 28px;
      color: #ffeb3b;
      text-shadow: 0 0 10px #000;
      display: none;
      animation: blink 0.3s infinite alternate;
      z-index: 10;
    }
    @keyframes blink {
      from { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      to   { opacity: 0.7; transform: translate(-50%, -50%) scale(1.1); }
    }
  </style>
</head>
<body>
  <div class="game-container">
    <!-- 도감 -->
    <div class="collection">
      <h2>도감</h2>
      <div id="collectionList"></div>
    </div>

    <!-- 메인 -->
    <div class="main">
      <h1>도트 낚시</h1>

      <div class="scene" id="scene">
        <div class="ground"></div>
        <div class="stickman">
          <div class="head"></div>
          <div class="body"></div>
          <div class="arm" id="arm"></div>
          <div class="leg"></div>
          <div class="leg leg2"></div>
          <div class="chair"></div>
          <div class="rod"></div>
          <div class="line" id="line">
            <div class="bobber"></div>
          </div>
        </div>
        <div class="wave" style="right:20%; bottom:35%;"></div>
        <div class="wave" style="right:35%; bottom:28%; width:40px;"></div>
        <div class="click-alert" id="clickAlert">클릭!</div>
      </div>

      <div id="status">버튼을 눌러 낚시를 시작하세요</div>

      <button id="fishBtn" onclick="startFishing()">낚시하기</button>

      <div class="result-banner" id="resultBanner">
        <div class="grade" id="resultGrade"></div>
        <img id="resultFishImage" class="result-fish-image" alt="잡은 물고기">
        <div class="fish-name" id="resultFish"></div>
      </div>
    </div>
  </div>

    // 도감 저장/불러오기: 브라우저별 localStorage에 저장됩니다.
    // 같은 브라우저/프로필에서 다시 열면 기록이 유지되고, 다른 브라우저의 기록과는 분리됩니다.
    const COLLECTION_KEY = "fishCollection";
    let collection = {};
    try {
      collection = JSON.parse(localStorage.getItem(COLLECTION_KEY) || "{}") || {};
    } catch (error) {
      console.warn("도감 데이터를 불러오지 못했습니다.", error);
      collection = {};
    }

    function saveCollection() {
      try {
        localStorage.setItem(COLLECTION_KEY, JSON.stringify(collection));
      } catch (error) {
        document.getElementById("status").innerText = "저장 공간 또는 브라우저 설정을 확인하세요.";
        console.error("도감 저장 실패:", error);
      }
    }

    function updateCollectionUI() {
      const list = document.getElementById("collectionList");
      list.innerHTML = "";
      for (const grade of grades) {
        for (const fish of fishList[grade.name]) {
          const count = collection[fish] || 0;
          const div = document.createElement("div");
          div.className = "fish-count";
          div.innerHTML = `
            <div class="fish-entry">
              <img src="${fishImages[fish]}" alt="${fish}" title="${fish}">
              <span title="${fish}">${fish}</span>
            </div>
            <span class="fish-number">${count}</span>`;
          list.appendChild(div);
        }
      }
    }

    // 확률로 등급 뽑기
    function rollGrade() {
      const r = Math.random();
      let acc = 0;
      for (const g of grades) {
        acc += g.prob;
        if (r < acc) return g;
      }
      return grades[0]; // 혹시 모를 나머지
    }

    let canClick = false;
    let clickTimer = null;
    let currentGrade = null;
    let fishing = false;

    function startFishing() {
      if (fishing) return;
      fishing = true;

      document.getElementById("fishBtn").disabled = true;
      document.getElementById("resultBanner").style.display = "none";
      document.getElementById("clickAlert").style.display = "none";
      document.getElementById("status").innerText = "낚시 중... 줄을 주시하세요";

      // 줄 흔들리는 모션
      const line = document.getElementById("line");
      let angle = 0;
      const swing = setInterval(() => {
        angle = Math.sin(Date.now() / 200) * 8;
        line.style.transform = `rotate(${angle}deg)`;
      }, 30);

      // 등급 미리 결정 (타이밍 난이도 결정용)
      currentGrade = rollGrade();

      // 3~7초 후 클릭 타이밍 등장
      const wait = 3000 + Math.random() * 4000;

      setTimeout(() => {
        clearInterval(swing);
        line.style.transform = "rotate(0deg)";

        // 클릭 타이밍 시작
        document.getElementById("status").innerText = "지금이다!";
        document.getElementById("clickAlert").style.display = "block";
        canClick = true;

        // 등급에 따른 제한 시간
        clickTimer = setTimeout(() => {
          // 시간 초과 → 실패
          canClick = false;
          document.getElementById("clickAlert").style.display = "none";
          document.getElementById("status").innerText = "놓쳤다... 다시 시도하세요";
          document.getElementById("fishBtn").disabled = false;
          fishing = false;
        }, currentGrade.time);

      }, wait);
    }

    // 클릭 감지 (화면 아무데나 or 버튼)
    document.body.addEventListener("click", (e) => {
      if (!canClick) return;
      if (e.target.tagName === "BUTTON") return;

      canClick = false;
      clearTimeout(clickTimer);
      document.getElementById("clickAlert").style.display = "none";

      // 성공!
      const fishName = fishList[currentGrade.name][Math.floor(Math.random() * 3)];

      // 도감 업데이트
      collection[fishName] = (collection[fishName] || 0) + 1;
      saveCollection();
      updateCollectionUI();

      // 결과 보여주기
      const banner = document.getElementById("resultBanner");
      banner.className = "result-banner " + currentGrade.cls;
      document.getElementById("resultGrade").innerText = `${currentGrade.name} / ${currentGrade.kor}`;
      document.getElementById("resultFish").innerText = fishName;
      document.getElementById("resultFishImage").src = fishImages[fishName];
      document.getElementById("resultFishImage").alt = fishName;
      banner.style.display = "block";

      document.getElementById("status").innerText = "낚아챘다!";
      document.getElementById("fishBtn").disabled = false;
      fishing = false;
    });

    // 초기화
    updateCollectionUI();
  </script>
</body>
</html>
